                                <button onclick="v_delItem('subjects', '${s.id}')" class="text-red-500 w-8 h-8 bg-red-50 rounded-lg flex items-center justify-center"><i class="fas fa-trash text-xs"></i></button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            else if (type === 'teachers') {
                title.innerText = 'إدارة الأساتذة';
                content.innerHTML = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm mb-5 border border-gray-200">
                        <select id="v_tch_sub" class="w-full mb-2 border rounded-xl p-2.5 bg-gray-50 text-sm">
                            ${dbData.subjects.map(s => `<option value="${s.id}">${s.grade} - ${s.name}</option>`).join('')}
                        </select>
                        <input type="text" id="v_tch_name" placeholder="اسم الأستاذ" class="w-full mb-2 border rounded-xl p-2.5 bg-gray-50 text-sm">
                        <input type="email" id="v_tch_email" placeholder="بريد الأستاذ (اختياري)" class="w-full mb-2 border rounded-xl p-2.5 bg-gray-50 text-left text-sm" dir="ltr">
                        <label class="block text-xs text-gray-500 mb-1">صورة الأستاذ (اختياري):</label>
                        <input type="file" id="v_tch_img" accept="image/*" class="w-full mb-3 border rounded-xl p-2 bg-gray-50 text-xs">
                        <button onclick="v_addTeacher()" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-xl text-sm">إضافة الأستاذ</button>
                    </div>
                    <div class="space-y-2">
                        ${dbData.teachers.map(t => {
                            const subName = dbData.subjects.find(x => x.id === t.subject)?.name || '';
                            const cnt = teacherSubscriberCounts[t.id] || 0;
                            return `
                            <div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                                <div class="flex items-center gap-3 min-w-0">
                                    <div class="w-10 h-10 rounded-lg bg-gray-200 overflow-hidden flex-shrink-0">${t.image ? `<img src="${t.image}" class="w-full h-full object-cover">` : ''}</div>
                                    <div class="min-w-0">
                                        <div class="font-bold text-xs truncate">${t.name}</div>
                                        <div class="text-[10px] text-gray-500 truncate">${t.grade} - ${subName}</div>
                                        <span class="subscriber-pill mt-1"><i class="fas fa-user-check"></i> ${cnt}</span>
                                    </div>
                                </div>
                                <button onclick="v_delItem('teachers', '${t.id}')" class="text-red-500 bg-red-50 p-2 rounded-lg flex-shrink-0"><i class="fas fa-trash text-xs"></i></button>
                            </div>`
                        }).join('')}
                    </div>
                `;
            }
            else if (type === 'chapters') {
                title.innerText = 'إدارة الفصول';
                content.innerHTML = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm mb-5 border border-gray-200">
                        <select id="v_chp_tch" class="w-full mb-2 border rounded-xl p-2.5 bg-gray-50 text-sm">
                            ${dbData.teachers.map(t => `<option value="${t.id}">${t.name} (${t.grade})</option>`).join('')}
                        </select>
                        <input type="text" id="v_chp_name" placeholder="اسم الفصل (مثال: الفصل الأول)" class="w-full mb-3 border rounded-xl p-2.5 bg-gray-50 text-sm">
                        <button onclick="v_addChapter()" class="w-full bg-purple-600 text-white font-bold py-2.5 rounded-xl text-sm">إضافة الفصل</button>
                    </div>
                    <div class="space-y-2">
                        ${dbData.chapters.map(c => {
                            const tName = dbData.teachers.find(x => x.id === c.teacher)?.name || '';
                            return `
                            <div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                                <div><div class="font-bold text-xs">${c.name}</div><div class="text-[10px] text-gray-500">أ. ${tName}</div></div>
                                <button onclick="v_delItem('chapters', '${c.id}')" class="text-red-500 bg-red-50 p-2 rounded-lg"><i class="fas fa-trash text-xs"></i></button>
                            </div>`
                        }).join('')}
                    </div>
                `;
            }
            else if (type === 'lectures') {
                title.innerText = 'إدارة المحاضرات';
                content.innerHTML = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm mb-5 border border-gray-200">
                        <select id="v_lec_chp" class="w-full mb-2 border rounded-xl p-2.5 bg-gray-50 text-sm">
                            ${dbData.chapters.map(c => {
                                const t = dbData.teachers.find(x => x.id === c.teacher);
                                return `<option value="${c.id}">${c.name} - ${t?.name || ''}</option>`;
                            }).join('')}
                        </select>
                        <input type="text" id="v_lec_name" placeholder="اسم المحاضرة" class="w-full mb-2 border rounded-xl p-2.5 bg-gray-50 text-sm">
                        <input type="url" id="v_lec_link" placeholder="رابط رسالة التلكرام" class="w-full mb-2 border rounded-xl p-2.5 bg-gray-50 text-left text-sm" dir="ltr">
                        <textarea id="v_lec_details" placeholder="التفاصيل الاضافية للمحاضرة..." class="w-full mb-3 border rounded-xl p-2.5 bg-gray-50 h-24 resize-none text-sm"></textarea>
                        <button onclick="v_addLecture()" class="w-full bg-red-600 text-white font-bold py-2.5 rounded-xl text-sm">نشر المحاضرة</button>
                    </div>
                    <div class="space-y-2">
                        ${dbData.lectures.map(l => `
                            <div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                                <div class="min-w-0 flex-1"><div class="font-bold text-xs truncate">${l.name}</div><div class="text-[10px] text-gray-400 truncate">${l.link}</div></div>
                                <button onclick="v_delItem('lectures', '${l.id}')" class="text-red-500 bg-red-50 p-2 rounded-lg flex-shrink-0"><i class="fas fa-trash text-xs"></i></button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            else if (type === 'exams') {
                title.innerText = 'إدارة الامتحانات';
                content.innerHTML = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm mb-4 border border-gray-200">
                        <label class="block text-xs font-bold text-gray-700 mb-2">اختر المحاضرة:</label>
                        <select id="v_exam_lec" class="w-full mb-3 border rounded-xl p-2.5 bg-gray-50 text-sm">
                            ${dbData.lectures.map(l => `<option value="${l.id}">${l.name}</option>`).join('')}
                        </select>
                        <button onclick="loadExamManager()" class="w-full bg-orange-600 text-white font-bold py-2.5 rounded-xl text-sm">عرض امتحانات المحاضرة</button>
                    </div>
                    <div id="examManagerArea"></div>
                `;
            }
            else if (type === 'codes') {
                title.innerText = 'إدارة الأكواد';
                content.innerHTML = '<div class="text-center py-10"><div class="loader mx-auto border-indigo-500 border-t-transparent"></div></div>';
                try {
                    const snap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'codes'));
                    dbData.codes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    content.innerHTML = `
                        <div class="bg-gray-800 p-4 rounded-2xl shadow-lg mb-5 border border-gray-700">
                            <select id="v_cod_tch" class="w-full mb-3 border border-gray-600 rounded-xl p-2.5 bg-gray-700 text-white text-sm">
                                ${dbData.teachers.map(t => `<option value="${t.id}">${t.grade} - ${t.name}</option>`).join('')}
                            </select>
                            <button onclick="v_addCode()" class="w-full bg-yellow-500 text-gray-900 font-bold py-2.5 rounded-xl active:bg-yellow-600 shadow-md text-sm">إنشاء كود جديد (لاستخدام واحد)</button>
                        </div>
                        <h3 class="font-bold mb-3 text-gray-700 text-sm">سجل الأكواد:</h3>
                        <div class="space-y-3">
                            ${dbData.codes.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).map(c => {
                                const tName = dbData.teachers.find(x => x.id === c.teacher)?.name || 'مجهول';
                                const statusClass = c.used ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-700';
                                const statusText = c.used ? 'مستخدم' : 'نشط';
                                return `
                                <div class="bg-white p-3.5 rounded-xl border flex flex-col shadow-sm gap-2">
                                    <div class="flex justify-between items-start">
                                        <div class="font-mono font-bold text-sm tracking-widest text-gray-800 select-all">${c.id}</div>
                                        <span class="text-[10px] font-bold px-2 py-1 rounded ${statusClass}">${statusText}</span>
                                    </div>
                                    <div class="text-[11px] text-gray-500 border-b pb-2">أ. ${tName}</div>
                                    <button onclick="v_delCode('${c.id}', '${c.usedBy || ''}', '${c.teacher}')" class="w-full mt-1 bg-red-50 text-red-600 text-[11px] font-bold py-2 rounded-lg flex items-center justify-center gap-2">
                                        <i class="fas fa-trash"></i> حذف الكود ${c.used ? '(وإلغاء الصلاحية)' : ''}
                                    </button>
                                </div>`
                            }).join('')}
                        </div>
                    `;
                } catch(e) {
                    content.innerHTML = '<div class="text-red-500 text-center text-sm">خطأ في جلب الأكواد</div>';
                }
            }
            else if (type === 'teacherAccess') {
                title.innerText = 'صلاحيات الأساتذة';
                content.innerHTML = `
                    <div class="bg-teal-50 border border-teal-200 p-3.5 rounded-2xl mb-4 text-xs text-teal-800">
                        <i class="fas fa-info-circle ml-1"></i> اربط حساب أستاذ ببريده المسجل، وسيتمكن من إدارة محاضراته والاطلاع على طلابه.
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm mb-5 border border-gray-200">
                        <label class="block text-xs font-bold mb-1">اختر الأستاذ:</label>
                        <select id="v_ta_tch" class="w-full mb-3 border rounded-xl p-2.5 bg-gray-50 text-sm">
                            ${dbData.teachers.map(t => `<option value="${t.id}">${t.name} - ${t.grade}</option>`).join('')}
                        </select>
                        <label class="block text-xs font-bold mb-1">بريد الأستاذ المسجل:</label>
                        <input type="email" id="v_ta_email" placeholder="teacher@example.com" class="w-full mb-3 border rounded-xl p-2.5 bg-gray-50 text-left text-sm" dir="ltr">
                        <button onclick="v_assignTeacher()" class="w-full bg-teal-600 text-white font-bold py-2.5 rounded-xl text-sm">ربط الحساب</button>
                    </div>
                    <h3 class="font-bold mb-3 text-gray-700 text-sm">الأساتذة المربوطون:</h3>
                    <div class="space-y-2">
                        ${dbData.teachers.filter(t => t.ownerEmail).map(t => {
                            const cnt = teacherSubscriberCounts[t.id] || 0;
                            return `
                            <div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                                <div class="min-w-0">
                                    <div class="font-bold text-xs truncate">${t.name}</div>
                                    <div class="text-[10px] text-gray-500 truncate" dir="ltr" style="text-align:right">${t.ownerEmail}</div>
                                    <span class="subscriber-pill mt-1"><i class="fas fa-user-check"></i> ${cnt}</span>
                                </div>
                                <button onclick="v_unassignTeacher('${t.id}')" class="text-red-500 bg-red-50 px-3 py-2 rounded-lg text-[11px] font-bold flex-shrink-0">إلغاء</button>
                            </div>`;
                        }).join('') || '<p class="text-gray-400 text-center py-4 text-sm">لا يوجد أساتذة مربوطون</p>'}
                    </div>
                `;
            }
        };

        window.loadExamManager = async () => {
            const lecId = document.getElementById('v_exam_lec').value;
            const area = document.getElementById('examManagerArea');
            area.innerHTML = '<div class="text-center py-6"><div class="loader mx-auto"></div></div>';
            try {
                const snap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'lectures', lecId, 'exams'));
                const exams = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                area.innerHTML = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm mb-4 border border-gray-200">
                        <h4 class="font-bold mb-3 text-sm">إضافة / تعديل امتحان</h4>
                        <label class="block text-xs mb-1">رقم النسخة (1-4):</label>
                        <input type="number" id="exam_version" min="1" max="4" value="1" class="w-full mb-2 border rounded-xl p-2.5 bg-gray-50 text-sm">
                        <label class="block text-xs mb-1">صورة أسئلة الامتحان:</label>
                        <input type="file" id="exam_img" accept="image/*" class="w-full mb-3 border rounded-xl p-2 bg-gray-50 text-xs">
                        <button onclick="v_saveExam('${lecId}')" class="w-full bg-orange-600 text-white font-bold py-2.5 rounded-xl text-sm">حفظ الامتحان</button>
                    </div>
                    <h4 class="font-bold mb-2 text-gray-700 text-sm">الامتحانات الحالية (${exams.length}):</h4>
                    <div class="grid grid-cols-2 gap-3">
                        ${exams.map(e => `
                            <div class="bg-white p-2 rounded-xl border shadow-sm">
                                <img src="${e.image}" class="w-full rounded-lg mb-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-[11px] font-bold">نسخة ${e.version || '?'}</span>
                                    <button onclick="v_delExam('${lecId}', '${e.id}')" class="text-red-500 bg-red-50 p-1.5 rounded"><i class="fas fa-trash text-[10px]"></i></button>
                                </div>
                            </div>
                        `).join('') || '<p class="col-span-2 text-center text-gray-400 py-4 text-sm">لا توجد امتحانات</p>'}
                    </div>
                `;
            } catch(e) {
                area.innerHTML = '<p class="text-red-500 text-center text-sm">خطأ</p>';
            }
        };

        window.v_saveExam = async (lecId) => {
            const version = parseInt(document.getElementById('exam_version').value);
            const file = document.getElementById('exam_img').files[0];
            if(!file) return showToast('اختر صورة', 'error');
            if(version < 1 || version > 4) return showToast('رقم النسخة يجب بين 1 و 4', 'error');
            try {
                const b64 = await fileToBase64(file);
                const examId = `v${version}`;
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'lectures', lecId, 'exams', examId), {
                    version, image: b64, updatedAt: Date.now()
                });
                showToast('تم الحفظ');
                loadExamManager();
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_delExam = async (lecId, examId) => {
            if(!confirm('حذف الامتحان؟')) return;
            try {
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'lectures', lecId, 'exams', examId));
                showToast('تم الحذف');
                loadExamManager();
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_addSubject = async () => {
            const grade = document.getElementById('v_sub_grade').value;
            const name = document.getElementById('v_sub_name').value.trim();
            if(!name) return showToast('اكتب الاسم', 'error');
            try {
                const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'subjects'));
                await setDoc(docRef, { grade, name });
                dbData.subjects.push({ id: docRef.id, grade, name });
                showToast('تم'); openAdminView('subjects');
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_addTeacher = async () => {
            const subId = document.getElementById('v_tch_sub').value;
            const name = document.getElementById('v_tch_name').value.trim();
            const email = document.getElementById('v_tch_email').value.trim();
            const imgFile = document.getElementById('v_tch_img').files[0];
            if(!name) return showToast('اكتب الاسم', 'error');
            let base64Img = null;
            if(imgFile) base64Img = await fileToBase64(imgFile);
            const subject = dbData.subjects.find(s => s.id === subId);
            try {
                const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'teachers'));
                const data = { grade: subject.grade, subject: subId, name, image: base64Img, ownerEmail: email || null };
                await setDoc(docRef, data);
                dbData.teachers.push({ id: docRef.id, ...data });
                showToast('تم'); openAdminView('teachers');
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_addChapter = async () => {
            const teacherId = document.getElementById('v_chp_tch').value;
            const name = document.getElementById('v_chp_name').value.trim();
            if(!name) return;
            const teacher = dbData.teachers.find(t => t.id === teacherId);
            try {
                const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'chapters'));
                const data = { grade: teacher.grade, subject: teacher.subject, teacher: teacherId, name };
                await setDoc(docRef, data);
                dbData.chapters.push({ id: docRef.id, ...data });
                showToast('تم'); openAdminView('chapters');
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_addLecture = async () => {
            const chapterId = document.getElementById('v_lec_chp').value;
            const name = document.getElementById('v_lec_name').value.trim();
            const link = document.getElementById('v_lec_link').value.trim();
            const details = document.getElementById('v_lec_details').value.trim();
            if(!name || !link) return showToast('الاسم والرابط مطلوبان', 'error');
            const chapter = dbData.chapters.find(c => c.id === chapterId);
            try {
                const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'lectures'));
                const data = { grade: chapter.grade, subject: chapter.subject, teacher: chapter.teacher, chapter: chapterId, name, link, details, timestamp: Date.now() };
                await setDoc(docRef, data);
                dbData.lectures.push({ id: docRef.id, ...data });
                showToast('تم'); openAdminView('lectures');
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_addCode = async () => {
            const teacherId = document.getElementById('v_cod_tch').value;
            const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
            const codeId = `DARB-${randomStr}`;
            try {
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'codes', codeId), {
                    teacher: teacherId, used: false, usedBy: null, createdAt: new Date().toISOString()
                });
                showToast('تم إنشاء الكود'); openAdminView('codes');
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_assignTeacher = async () => {
            const teacherId = document.getElementById('v_ta_tch').value;
            const email = document.getElementById('v_ta_email').value.trim().toLowerCase();
            if(!email) return showToast('اكتب البريد', 'error');
            try {
                await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'teachers', teacherId), { ownerEmail: email });
                const t = dbData.teachers.find(x => x.id === teacherId);
                if(t) t.ownerEmail = email;
                showToast('تم الربط'); openAdminView('teacherAccess');
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_unassignTeacher = async (teacherId) => {
            if(!confirm('إلغاء الربط؟')) return;
            try {
                await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'teachers', teacherId), { ownerEmail: null });
                const t = dbData.teachers.find(x => x.id === teacherId);
                if(t) t.ownerEmail = null;
                showToast('تم'); openAdminView('teacherAccess');
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_delItem = async (col, id) => {
            if(!confirm('هل أنت متأكد من الحذف؟')) return;
            try {
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', col, id));
                dbData[col] = dbData[col].filter(x => x.id !== id);
                showToast('تم الحذف'); openAdminView(col);
            } catch(e) { showToast('خطأ بالحذف', 'error'); }
        };

        window.v_delCode = async (codeId, usedByUserId, teacherId) => {
            if(!confirm('هل أنت متأكد؟ إذا كان مستخدماً سيتم سحب الصلاحية من الطالب.')) return;
            try {
                if(usedByUserId && teacherId) {
                    await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', usedByUserId, 'subscriptions', teacherId));
                    if(teacherSubscriberCounts[teacherId]) teacherSubscriberCounts[teacherId] = Math.max(0, teacherSubscriberCounts[teacherId] - 1);
                }
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'codes', codeId));
                showToast('تم'); openAdminView('codes');
            } catch(e) { showToast('خطأ بالحذف', 'error'); }
        };

        document.addEventListener('contextmenu', (e) => {
            if(e.target.tagName === 'VIDEO' || e.target.closest('.custom-player')) e.preventDefault();
        });
    </script>
</body>
</html>
