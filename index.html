<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق تشريح الأسنان 3D</title>
    <style>
        /* إعدادات التصميم الأساسية وتوافق الهواتف */
        body { 
            margin: 0; 
            overflow: hidden; 
            background: linear-gradient(135deg, #1e1e1e, #000000); /* خلفية احترافية */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* منع التكبير العشوائي عند اللمس */
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
        }
        
        /* شاشة التحميل (Loader) */
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00ff88; font-size: 16px; font-weight: bold; z-index: 20;
            background: rgba(0,0,0,0.8); padding: 15px 30px; border-radius: 8px;
            text-align: center; border: 1px solid #00ff88;
        }

        /* نافذة المعلومات التي تظهر عند الضغط على السن */
        #info-card {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); display: none; z-index: 10;
            border-top: 4px solid #007bff; max-height: 40vh; overflow-y: auto;
        }
        #info-card h3 { margin: 0 0 10px 0; color: #111; font-size: 20px; }
        #info-card p { margin: 0 0 15px 0; color: #444; font-size: 15px; line-height: 1.6; }
        .close-btn {
            background: #e74c3c; color: white; border: none; padding: 12px;
            border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold;
        }

        /* نافذة المساعدة لاكتشاف أسماء الأسنان البرمجية */
        #debug-panel {
            position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7);
            color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; z-index: 10;
            border: 1px solid #ffcc00; display: none; direction: ltr; text-align: left;
        }
    </style>
    
    <!-- مكتبات Three.js (الإصدار r128 مستقر ويدعم gltf بشكل ممتاز) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loader">جاري تحميل النموذج الهندسي...<br><span id="loading-percent">0%</span></div>
    
    <!-- هذه النافذة ستعرض لك اسم الجزء الملموس لتضيفه في الكود لاحقاً -->
    <div id="debug-panel">Mesh Name: <span id="debug-name-val">None</span></div>
    
    <div id="info-card">
        <h3 id="tooth-title">اسم السن</h3>
        <p id="tooth-desc">التفاصيل الطبية للسن.</p>
        <button class="close-btn" onclick="closeInfo()">إغلاق المعلومات</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // 1. إعداد المشهد الأساسي
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // تحسين الأداء للهواتف وضبط الألوان لتطابق الصور الواقعية
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputEncoding = THREE.sRGBEncoding; 
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. إعداد الإضاءة (مهمة لظهور تفاصيل اللثة والأسنان)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // 3. أداة التحكم (الدوران والتقريب بإصبعين)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;

        // ==========================================
        // 4. قاعدة بيانات الأسنان (ستقوم بتعديلها لاحقاً)
        // ==========================================
        const teethData = {
            // مثال: استبدل 'Object_1' بالاسم الذي يظهر لك في الشاشة عند الضغط
            "Object_1": { title: "القاطع المركزي العلوي", desc: "أحد الأسنان الأمامية، وظيفته الأساسية قطع الطعام." },
            "Object_2": { title: "الناب السفلي", desc: "يتميز بجذر طويل وقوي، وظيفته تمزيق الطعام." }
        };

        // 5. تحميل مجسم الـ GLTF
        let model;
        const loader = new THREE.GLTFLoader();
        
        // مسار الملف كما هو موجود في جيثوب
        const modelUrl = 'scene.gltf'; 

        loader.load(
            modelUrl,
            function (gltf) {
                model = gltf.scene;
                
                // حساب أبعاد المجسم وتوسيطه تلقائياً
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                // ضبط حجم المجسم ليتناسب مع الكاميرا
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 5 / maxDim;
                model.scale.set(scale, scale, scale);
                model.position.sub(center.multiplyScalar(scale)); // التوسيط
                
                scene.add(model);
                
                // وضع الكاميرا في مسافة مناسبة لرؤية المجسم كاملاً
                camera.position.set(0, 0, 10);
                
                document.getElementById('loader').style.display = 'none';
            },
            function (xhr) {
                // تحديث نسبة التحميل
                if (xhr.total > 0) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    document.getElementById('loading-percent').innerText = percent + '%';
                }
            },
            function (error) {
                console.error('خطأ في تحميل النموذج:', error);
                document.getElementById('loader').innerHTML = '<span style="color:#e74c3c">فشل تحميل النموذج! تأكد من رفع الملفات لجيثوب بشكل صحيح.</span>';
            }
        );

        // 6. نظام اكتشاف اللمس (Raycaster)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // دعم الهواتف والشاشات اللمسية
        window.addEventListener('touchstart', (e) => {
            if(e.touches.length > 0 && e.target.tagName !== 'BUTTON') {
                processClick(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        // دعم الماوس (في حال الاختبار من الكمبيوتر)
        window.addEventListener('click', (e) => {
            if(e.target.tagName !== 'BUTTON') {
                processClick(e.clientX, e.clientY);
            }
        });

        function processClick(clientX, clientY) {
            if (!model) return;

            // تحويل إحداثيات الشاشة إلى إحداثيات 3D
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // البحث عن الكائن الذي تقاطع معه اللمس
            const intersects = raycaster.intersectObjects(model.children, true);

            if (intersects.length > 0) {
                // نأخذ أول كائن (الأقرب للكاميرا)
                const clickedObject = intersects[0].object;
                const meshName = clickedObject.name;

                // عرض الاسم البرمجي لتتمكن من نسخه
                document.getElementById('debug-panel').style.display = 'block';
                document.getElementById('debug-name-val').innerText = meshName;

                showToothInfo(meshName);
            }
        }

        // 7. دالة عرض معلومات السن
        function showToothInfo(meshName) {
            const card = document.getElementById('info-card');
            const titleEl = document.getElementById('tooth-title');
            const descEl = document.getElementById('tooth-desc');

            if (teethData[meshName]) {
                // إذا كان السن مضافاً في قاعدة البيانات
                titleEl.innerText = teethData[meshName].title;
                descEl.innerText = teethData[meshName].desc;
                titleEl.style.color = '#007bff';
            } else {
                // إذا لم تقم بإضافته بعد
                titleEl.innerText = "جزء غير مسجل";
                descEl.innerText = `هذا الجزء يحمل الاسم البرمجي "${meshName}". يرجى إضافته إلى متغير teethData داخل الكود لتظهر معلوماته.`;
                titleEl.style.color = '#e74c3c';
            }

            card.style.display = 'block';
        }

        function closeInfo() {
            document.getElementById('info-card').style.display = 'none';
            document.getElementById('debug-panel').style.display = 'none';
        }

        // 8. الاستجابة لتغير حجم الشاشة (تدوير الهاتف)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 9. حلقة التحديث المستمر
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // ضروري لحركة الكاميرا الناعمة
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
