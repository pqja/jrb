<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>منصة طموح التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --secondary: #10B981;
            --bg-color: #F8FAFC;
            --text-main: #1F2937;
            --premium-bg: #0F0A2E;
            --app-max-width: 900px;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0; padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior-y: none;
            font-size: 14px;
        }

        .font-kufi { font-family: 'Reem Kufi', 'Cairo', sans-serif; }

        input, textarea, select {
            font-size: 16px !important;
            -webkit-user-select: auto;
            user-select: auto;
            font-family: 'Cairo', sans-serif;
        }

        /* ============ Global responsive container ============ */
        #appShell {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 1024px) {
            #appShell { max-width: 1280px; margin: 0 auto; }
        }

        /* Center content of main app on large screens */
        #mainApp { width: 100%; height: 100%; display: flex; flex-direction: column; }
        @media (min-width: 1024px) {
            #mainApp { max-width: 1000px; margin: 0 auto; }
        }

        .auth-bg {
            background: linear-gradient(135deg, #1e1b4b, #312e81, #4338ca);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-dark {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
        }
        .input-dark::placeholder { color: rgba(255,255,255,0.5); }
        .input-dark:focus { border-color: var(--primary); background: rgba(0, 0, 0, 0.6); outline: none; }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bottom-nav { box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .nav-item { color: #9CA3AF; transition: color 0.2s ease; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active .nav-icon { transform: translateY(-3px); transition: all 0.3s ease; }

        video { width: 100%; background: #000; }

        ::-webkit-scrollbar { width: 0px; background: transparent; }

        .toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 99999; transition: all 0.3s ease; opacity: 0; pointer-events: none;
            font-size: 13px; max-width: 90vw; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(8px); }

        .chat-msg-user { background: var(--primary); color: white; border-radius: 16px 16px 0 16px; }
        .chat-msg-bot { background: white; color: var(--text-main); border-radius: 16px 16px 16px 0; border: 1px solid #e5e7eb; }

        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            width: 22px; height: 22px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #splashScreen {
            background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #0F0A2E 60%, #050118 100%);
        }
        .splash-title {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, #818cf8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.05em;
            animation: premiumGlow 3s ease-in-out infinite;
        }
        @keyframes premiumGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(129, 140, 248, 0.6)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 40px rgba(165, 180, 252, 0.9)); transform: scale(1.03); }
        }
        .splash-decoration {
            position: absolute; width: 320px; height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(129, 140, 248, 0.15) 0%, transparent 70%);
            animation: floatOrb 6s ease-in-out infinite;
        }
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -20px) scale(1.1); }
        }
        .splash-loader-bar {
            width: 160px; height: 3px; background: rgba(255,255,255,0.1);
            border-radius: 10px; overflow: hidden; margin-top: 28px;
        }
        .splash-loader-bar::after {
            content: ''; display: block; width: 40%; height: 100%;
            background: linear-gradient(90deg, transparent, #818cf8, transparent);
            animation: loadingSlide 1.5s ease-in-out infinite;
        }
        @keyframes loadingSlide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        /* ===================== Custom Video Player ===================== */
        .custom-player {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
            border-radius: 0;
            touch-action: manipulation;
        }
        .custom-player video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .player-controls-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.35) 100%);
            opacity: 0; transition: opacity 0.25s ease;
            pointer-events: none;
        }
        .custom-player.controls-visible .player-controls-overlay {
            opacity: 1;
        }
        .custom-player.controls-visible .player-controls-overlay .player-btn,
        .custom-player.controls-visible .player-controls-overlay .player-progress-wrap {
            pointer-events: auto;
        }
        .player-top-bar {
            position: absolute; top: 0; left: 0; right: 0;
            padding: 10px 12px;
            display: flex; justify-content: space-between; align-items: center;
            color: white;
        }
        .player-bottom-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 8px 12px 12px;
            color: white;
        }
        .player-progress-wrap {
            width: 100%; height: 26px;
            display: flex; align-items: center;
            cursor: pointer; padding: 10px 0;
            touch-action: none;
        }
        .player-progress-track {
            position: relative; width: 100%; height: 4px;
            background: rgba(255,255,255,0.25);
            border-radius: 4px;
            transition: height 0.15s ease;
        }
        .player-progress-wrap:hover .player-progress-track { height: 6px; }
        .player-progress-buffer {
            position: absolute; top: 0; left: 0; height: 100%;
            background: rgba(255,255,255,0.4); border-radius: 4px;
        }
        .player-progress-fill {
            position: absolute; top: 0; left: 0; height: 100%;
            background: linear-gradient(90deg, #ef4444, #f87171);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }
        .player-progress-dot {
            position: absolute; top: 50%; transform: translate(-50%, -50%);
            width: 14px; height: 14px; border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.25), 0 2px 8px rgba(0,0,0,0.5);
            transition: transform 0.15s ease;
            pointer-events: none;
            z-index: 2;
        }
        .player-progress-wrap:hover .player-progress-dot { transform: translate(-50%, -50%) scale(1.3); }
        .player-btn {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            border: none; color: white;
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease;
            font-size: 13px;
        }
        .player-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }
        .player-btn.big-play {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 62px; height: 62px;
            background: rgba(255,255,255,0.95);
            color: #111; font-size: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .player-btn.big-play:hover { transform: translate(-50%, -50%) scale(1.1); background: white; }

        /* Fullscreen: CSS fallback (portrait phones) */
        .custom-player.is-fullscreen {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            aspect-ratio: auto !important;
            z-index: 99999 !important;
            border-radius: 0 !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .custom-player.is-fullscreen video {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain;
        }
        .custom-player.is-fullscreen .player-top-bar,
        .custom-player.is-fullscreen .player-bottom-bar {
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
        }

        .player-red-indicator {
            position: absolute; top: 12px; left: 12px;
            width: 9px; height: 9px; border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 12px rgba(239,68,68,0.9);
            animation: redPulse 1.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 3;
        }
        @keyframes redPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        /* ===== Admin ===== */
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }
        .admin-card-btn {
            aspect-ratio: 1 / 1;
            background: white;
            border-radius: 18px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 10px; padding: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.04);
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .admin-card-btn:active { transform: scale(0.96); }
        .admin-card-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.12); }
        .admin-card-btn .icon-box {
            width: 50px; height: 50px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; position: relative; z-index: 2;
        }
        .admin-card-btn .label {
            font-weight: 700; font-size: 12px;
            color: #1F2937; position: relative; z-index: 2;
            text-align: center; line-height: 1.3;
        }

        .exam-btn {
            padding: 12px; border-radius: 14px; font-weight: 700;
            text-align: center; cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            font-size: 13px;
        }
        .exam-btn:active { transform: scale(0.97); }

        .answer-thumb {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background: #f3f4f6;
            border: 2px dashed #d1d5db;
        }
        .answer-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .answer-thumb .remove-btn {
            position: absolute; top: 4px; right: 4px;
            width: 22px; height: 22px; border-radius: 50%;
            background: rgba(239, 68, 68, 0.95);
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 10px; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .result-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px; border-radius: 9px;
            font-weight: 700; font-size: 11px;
        }
        .grade-excellent { background: #d1fae5; color: #065f46; }
        .grade-good { background: #dbeafe; color: #1e40af; }
        .grade-fair { background: #fef3c7; color: #92400e; }
        .grade-poor { background: #fee2e2; color: #991b1b; }

        .subscriber-pill {
            display: inline-flex; align-items: center; gap: 5px;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: white; font-weight: 700; font-size: 10px;
            padding: 4px 10px; border-radius: 20px;
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
        }
        .subscriber-pill i { font-size: 10px; }

        body.fullscreen-active #mainApp,
        body.fullscreen-active #adminContainerMaster,
        body.fullscreen-active #lectureDetailsMaster .p-5.bg-white { visibility: hidden; }

        /* ================= Profile section ================= */
        .profile-hero {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            border-radius: 24px;
            padding: 24px 20px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 30px -8px rgba(99, 102, 241, 0.5);
        }
        .profile-hero::before {
            content: '';
            position: absolute;
            top: -50%; right: -30%;
            width: 240px; height: 240px;
            background: rgba(255,255,255,0.12);
            border-radius: 50%;
        }
        .profile-hero::after {
            content: '';
            position: absolute;
            bottom: -60%; left: -20%;
            width: 200px; height: 200px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .profile-avatar {
            width: 84px; height: 84px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.9);
            background: white;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            position: relative;
            z-index: 2;
        }
        .profile-section-title {
            font-size: 12px;
            font-weight: 700;
            color: #6B7280;
            margin: 18px 4px 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .profile-menu {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.04);
        }
        .profile-menu-item {
            width: 100%;
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px;
            cursor: pointer;
            transition: background 0.2s ease;
            text-align: right;
            border: none; background: transparent;
            font-family: inherit;
            font-size: 14px;
            color: #374151;
            font-weight: 600;
        }
        .profile-menu-item + .profile-menu-item {
            border-top: 1px solid #F3F4F6;
        }
        .profile-menu-item:active { background: #F9FAFB; }
        .profile-menu-icon {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .profile-menu-arrow {
            margin-right: auto;
            color: #D1D5DB;
            font-size: 12px;
        }
        .profile-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }
        .profile-info-box {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(6px);
            border-radius: 14px;
            padding: 10px 12px;
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .profile-info-box .lbl {
            font-size: 10px;
            opacity: 0.85;
            margin-bottom: 2px;
        }
        .profile-info-box .val {
            font-size: 12px;
            font-weight: 700;
            word-break: break-all;
            direction: ltr;
            text-align: left;
        }
        .logout-btn {
            width: 100%;
            background: #FEF2F2;
            color: #DC2626;
            border: 1px solid #FEE2E2;
            border-radius: 16px;
            padding: 14px;
            font-weight: 700;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .logout-btn:active { transform: scale(0.97); background: #FEE2E2; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden relative">

<div id="appShell">

    <div id="toast" class="toast px-5 py-2.5 rounded-full text-white font-semibold shadow-lg"></div>

    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div id="modalContent" class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto"></div>
    </div>

    <div id="splashScreen" class="absolute inset-0 z-[999] flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="splash-decoration" style="top: 10%; left: 10%;"></div>
        <div class="splash-decoration" style="bottom: 10%; right: 10%; animation-delay: 2s;"></div>
        <div class="relative z-10 flex flex-col items-center">
            <h1 class="splash-title font-kufi">طموح</h1>
            <div class="splash-loader-bar"></div>
        </div>
    </div>

    <div id="authScreen" class="absolute inset-0 z-40 auth-bg flex items-center justify-center p-4 overflow-y-auto hidden">
        <div class="glass-card w-full max-w-sm rounded-[2rem] p-7 relative">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-lg mb-3">
                    <i class="fas fa-graduation-cap text-3xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-white mb-1 font-kufi">منصة طموح</h1>
                <p class="text-gray-300 text-xs">سجل دخولك للمتابعة</p>
            </div>

            <form id="loginForm" class="space-y-3">
                <div>
                    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" class="w-full input-dark rounded-xl px-4 py-3 focus:outline-none transition" required>
                </div>
                <div>
                    <input type="password" id="loginPassword" placeholder="الرمز السري" class="w-full input-dark rounded-xl px-4 py-3 focus:outline-none transition" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold rounded-xl py-3 shadow-lg hover:bg-indigo-500 transition transform active:scale-95 mt-2">تسجيل الدخول</button>
                <p class="text-center text-gray-300 text-xs mt-4 cursor-pointer hover:text-white transition" onclick="toggleAuth('signup')">لا تملك حساب؟ <span class="font-bold text-indigo-400">أنشئ حساب الآن</span></p>
            </form>

            <form id="signupForm" class="space-y-3 hidden">
                <div>
                    <input type="text" id="signupName" placeholder="الاسم الثلاثي" class="w-full input-dark rounded-xl px-4 py-3 focus:outline-none transition" required>
                </div>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-gray-400 text-sm" dir="ltr">+964</span>
                    <input type="tel" id="signupPhone" placeholder="07XXXXXXXXX" pattern="07[0-9]{9}" class="w-full input-dark rounded-xl pl-16 pr-4 py-3 focus:outline-none transition text-right" required>
                </div>
                <div>
                    <input type="email" id="signupEmail" placeholder="البريد الإلكتروني" class="w-full input-dark rounded-xl px-4 py-3 focus:outline-none transition" required>
                </div>
                <div>
                    <input type="password" id="signupPassword" placeholder="رمز الحساب" class="w-full input-dark rounded-xl px-4 py-3 focus:outline-none transition" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold rounded-xl py-3 shadow-lg hover:bg-indigo-500 transition transform active:scale-95 mt-2">إنشاء الحساب</button>
                <p class="text-center text-gray-300 text-xs mt-4 cursor-pointer hover:text-white transition" onclick="toggleAuth('login')">لديك حساب؟ <span class="font-bold text-indigo-400">سجل دخولك</span></p>
            </form>
        </div>
    </div>

    <div id="mainApp" class="hidden flex-1 h-full flex flex-col relative pb-[68px]">
        <header class="bg-white shadow-sm px-4 py-3 flex justify-between items-center z-10 rounded-b-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 shadow-inner">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div>
                    <h2 class="font-bold text-gray-800 text-base leading-tight" id="headerTitle">المحاضرات</h2>
                    <p class="text-[11px] text-gray-500" id="headerSub">منصة طموح</p>
                </div>
            </div>
            <button id="backBtn" class="hidden w-9 h-9 bg-gray-100 rounded-full items-center justify-center text-gray-600 active:bg-gray-200 transition" onclick="goBack()">
                <i class="fas fa-arrow-left text-sm"></i>
            </button>
        </header>

        <main id="contentArea" class="flex-1 overflow-y-auto p-4 scroll-smooth bg-gray-50/50"></main>

        <nav class="bottom-nav bg-white fixed bottom-0 w-full h-[68px] rounded-t-3xl flex justify-around items-center px-2 z-20">
            <button class="nav-item active flex flex-col items-center justify-center w-20 h-full" onclick="switchTab('lectures', this)">
                <div class="nav-icon text-lg mb-1"><i class="fas fa-play-circle"></i></div>
                <span class="text-[10px] font-bold">المحاضرات</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center w-20 h-full" onclick="switchTab('ai', this)">
                <div class="nav-icon text-lg mb-1"><i class="fas fa-robot"></i></div>
                <span class="text-[10px] font-bold">المساعد الذكي</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center w-20 h-full" onclick="switchTab('profile', this)">
                <div class="nav-icon text-lg mb-1"><i class="fas fa-user"></i></div>
                <span class="text-[10px] font-bold">حسابي</span>
            </button>
        </nav>
    </div>

    <div id="adminContainerMaster" class="hidden absolute inset-0 z-[100] bg-gray-100 flex flex-col h-full w-full overflow-hidden"></div>
    <div id="lectureDetailsMaster" class="hidden absolute inset-0 z-[80] bg-gray-50 flex flex-col h-full w-full overflow-hidden"></div>

</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_VdrKx54tADWsmRDz1QSNn_bHnrbFI88",
            authDomain: "darb-56124.firebaseapp.com",
            projectId: "darb-56124",
            storageBucket: "darb-56124.firebasestorage.app",
            messagingSenderId: "705925344755",
            appId: "1:705925344755:web:e00882d29cf122d5c8f686",
            measurementId: "G-5G66M3LYJ6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = 'darb-56124';
        const ADMIN_EMAIL = "mslmalmyaly223@gmail.com";
        const GEMINI_API_KEY = "AQ.Ab8RN6J8jM8QZifmz55ZRmkZSDzOI5rQZbKKyfYXuLAICfcBhg";
        const GEMINI_MODELS = ["gemini-2.0-flash", "gemini-1.5-flash", "gemini-1.5-pro"];

        let currentUser = null;
        let userData = null;
        let currentTab = 'lectures';
        let navStack = [];
        let teacherSubscriberCounts = {};

        let dbData = {
            subjects: [], teachers: [], chapters: [], lectures: [], mySubscriptions: [], codes: [], exams: []
        };

        const DOM = {
            splashScreen: document.getElementById('splashScreen'),
            authScreen: document.getElementById('authScreen'),
            mainApp: document.getElementById('mainApp'),
            loginForm: document.getElementById('loginForm'),
            signupForm: document.getElementById('signupForm'),
            contentArea: document.getElementById('contentArea'),
            headerTitle: document.getElementById('headerTitle'),
            headerSub: document.getElementById('headerSub'),
            backBtn: document.getElementById('backBtn'),
            toast: document.getElementById('toast'),
            modalOverlay: document.getElementById('modalOverlay'),
            modalContent: document.getElementById('modalContent')
        };

        window.showToast = (msg, type = 'success') => {
            DOM.toast.textContent = msg;
            DOM.toast.className = `toast show px-5 py-2.5 rounded-full text-white font-semibold shadow-lg ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            setTimeout(() => DOM.toast.classList.remove('show'), 3500);
        };

        window.toggleAuth = (type) => {
            if(type === 'signup') {
                DOM.loginForm.classList.add('hidden');
                DOM.signupForm.classList.remove('hidden');
            } else {
                DOM.signupForm.classList.add('hidden');
                DOM.loginForm.classList.remove('hidden');
            }
        };

        window.showModal = (htmlContent) => {
            DOM.modalContent.innerHTML = htmlContent;
            DOM.modalOverlay.classList.remove('hidden');
            setTimeout(() => DOM.modalContent.classList.remove('scale-95'), 10);
        };

        window.closeModal = () => {
            DOM.modalContent.classList.add('scale-95');
            setTimeout(() => {
                DOM.modalOverlay.classList.add('hidden');
                DOM.modalContent.innerHTML = '';
            }, 300);
        };

        window.fileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        };

        DOM.loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = '<div class="loader mx-auto border-white border-t-transparent"></div>';
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                showToast('البريد أو الرمز السري غير صحيح', 'error');
                btn.innerHTML = originalText;
            }
        });

        DOM.signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const phone = document.getElementById('signupPhone').value;
            const email = document.getElementById('signupEmail').value;
            const pass = document.getElementById('signupPassword').value;

            if(!/^07[0-9]{9}$/.test(phone)) return showToast('رقم الهاتف غير صحيح', 'error');
            if(name.trim().split(/\s+/).length < 3) return showToast('يرجى كتابة الاسم الثلاثي', 'error');

            const btn = e.target.querySelector('button');
            btn.innerHTML = '<div class="loader mx-auto border-white border-t-transparent"></div>';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, 'artifacts', APP_ID, 'users', userCredential.user.uid, 'profile', 'data'), {
                    name, phone, email, grade: '', gender: Math.random() > 0.5 ? 'boy' : 'girl', createdAt: Date.now()
                });
            } catch (error) {
                showToast('خطأ: ' + error.message, 'error');
                btn.innerHTML = 'إنشاء الحساب';
            }
        });

        async function loadTeacherSubscriberCounts() {
            teacherSubscriberCounts = {};
            try {
                const codesSnap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'codes'));
                codesSnap.docs.forEach(d => {
                    const c = d.data();
                    if(c.used && c.teacher) {
                        teacherSubscriberCounts[c.teacher] = (teacherSubscriberCounts[c.teacher] || 0) + 1;
                    }
                });
            } catch(e) { console.warn(e); }
        }

        async function fetchInitialData() {
            if (!currentUser) return;
            DOM.contentArea.innerHTML = '<div class="flex h-full items-center justify-center"><div class="loader border-indigo-600 border-t-transparent w-10 h-10"></div></div>';

            try {
                const profileDoc = await getDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'profile', 'data'));
                if (profileDoc.exists()) {
                    userData = profileDoc.data();
                } else {
                    userData = { name: 'طالب', grade: '', gender: 'boy', email: currentUser.email };
                }

                const subsSnapshot = await getDocs(collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'subscriptions'));
                dbData.mySubscriptions = subsSnapshot.docs.map(d => d.id);

                const colls = ['subjects', 'teachers', 'chapters', 'lectures'];
                for(let col of colls) {
                    const snap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', col));
                    dbData[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                }

                dbData.lectures.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                await loadTeacherSubscriberCounts();

                if (userData.grade && currentTab === 'lectures' && navStack.length === 0) {
                    navStack.push({ type: 'grade', name: userData.grade });
                }

                renderCurrentTab();
            } catch(e) {
                console.error(e);
                showToast("حدث خطأ في جلب البيانات", "error");
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                DOM.authScreen.classList.add('hidden');
                DOM.mainApp.classList.remove('hidden');
                setTimeout(() => DOM.splashScreen.style.opacity = '0', 1600);
                setTimeout(() => DOM.splashScreen.classList.add('hidden'), 2300);
                fetchInitialData();
            } else {
                currentUser = null; userData = null;
                setTimeout(() => DOM.splashScreen.style.opacity = '0', 1600);
                setTimeout(() => DOM.splashScreen.classList.add('hidden'), 2300);
                DOM.mainApp.classList.add('hidden');
                DOM.authScreen.classList.remove('hidden');
            }
        });

        window.switchTab = (tabName, btnElement) => {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            currentTab = tabName;

            if(tabName === 'lectures' && userData && userData.grade) {
                navStack = [{ type: 'grade', name: userData.grade }];
            } else {
                navStack = [];
            }
            renderCurrentTab();
        };

        window.goBack = () => {
            if(navStack.length > 0) {
                if(navStack.length === 1 && userData && userData.grade) return;
                navStack.pop();
                renderLecturesFlow();
            }
        };

        function updateHeader(title, sub, showBack = false) {
            DOM.headerTitle.textContent = title;
            DOM.headerSub.textContent = sub;
            if(navStack.length === 1 && userData && userData.grade) showBack = false;
            DOM.backBtn.style.display = showBack ? 'flex' : 'none';
        }

        function renderCurrentTab() {
            DOM.contentArea.innerHTML = '';
            DOM.backBtn.style.display = 'none';

            if (currentTab === 'lectures') renderLecturesFlow();
            else if (currentTab === 'ai') renderAI();
            else if (currentTab === 'profile') renderProfile();
        }

        function renderLecturesFlow() {
            const level = navStack.length;
            DOM.contentArea.innerHTML = '';

            if (level === 0) {
                updateHeader('المراحل الدراسية', 'اختر مرحلتك', false);
                const grades = ['السادس العلمي', 'الثالث متوسط'];
                DOM.contentArea.innerHTML = `
                    <div class="space-y-3 mt-2">
                        ${grades.map(grade => `
                            <div onclick="selectGrade('${grade}')" class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-between active:scale-95 transition cursor-pointer">
                                <div>
                                    <h3 class="font-bold text-base text-gray-800">${grade}</h3>
                                    <p class="text-xs text-gray-500 mt-0.5">تحديد كمرحلتي الدراسية</p>
                                </div>
                                <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center">
                                    <i class="fas fa-chevron-left text-sm"></i>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (level === 1) {
                const currentGrade = navStack[0].name;
                updateHeader('المواد الدراسية', currentGrade, false);
                const subjects = dbData.subjects.filter(s => s.grade === currentGrade);
                if(subjects.length === 0) return DOM.contentArea.innerHTML = '<div class="text-center mt-20 text-gray-400"><i class="fas fa-folder-open text-4xl mb-4"></i><p class="text-sm">لا توجد مواد مضافة</p></div>';
                DOM.contentArea.innerHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 mt-2">
                        ${subjects.map(sub => `
                            <div onclick="pushNav({type: 'subject', id: '${sub.id}', name: '${sub.name}'})" class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center active:scale-95 transition cursor-pointer h-32 relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-14 h-14 bg-indigo-50 rounded-bl-[1.5rem] -z-0"></div>
                                <i class="fas fa-book text-2xl text-indigo-500 mb-2 z-10"></i>
                                <h3 class="font-bold text-gray-800 text-sm z-10">${sub.name}</h3>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (level === 2) {
                const currentGrade = navStack[0].name;
                const currentSubject = navStack[1];
                updateHeader('المدرسين', currentSubject.name, true);
                const teachers = dbData.teachers.filter(t => t.grade === currentGrade && t.subject === currentSubject.id);
                if(teachers.length === 0) return DOM.contentArea.innerHTML = '<div class="text-center mt-20 text-gray-400"><i class="fas fa-users text-4xl mb-4"></i><p class="text-sm">لا يوجد مدرسين</p></div>';
                DOM.contentArea.innerHTML = `
                    <div class="space-y-3 mt-2">
                        ${teachers.map(teacher => {
                            const count = teacherSubscriberCounts[teacher.id] || 0;
                            return `
                            <div onclick="pushNav({type: 'teacher', id: '${teacher.id}', name: '${teacher.name}'})" class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-3 active:scale-95 transition cursor-pointer">
                                <div class="w-14 h-14 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl flex items-center justify-center overflow-hidden shadow-md flex-shrink-0">
                                    ${teacher.image ? `<img src="${teacher.image}" class="w-full h-full object-cover">` : `<i class="fas fa-chalkboard-teacher text-white text-xl"></i>`}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-bold text-gray-800 text-sm truncate">${teacher.name}</h3>
                                    <div class="flex items-center gap-2 mt-1 flex-wrap">
                                        <p class="text-[11px] text-indigo-500 font-semibold">استعراض الفصول</p>
                                        <span class="subscriber-pill"><i class="fas fa-user-check"></i> ${count} مشترك</span>
                                    </div>
                                </div>
                                <i class="fas fa-chevron-left text-gray-300 text-sm"></i>
                            </div>`;
                        }).join('')}
                    </div>
                `;
            } else if (level === 3) {
                const currentTeacher = navStack[2];
                const count = teacherSubscriberCounts[currentTeacher.id] || 0;
                updateHeader('الفصول', currentTeacher.name, true);
                const chapters = dbData.chapters.filter(c => c.teacher === currentTeacher.id);
                if(chapters.length === 0) return DOM.contentArea.innerHTML = '<div class="text-center mt-20 text-gray-400"><i class="fas fa-layer-group text-4xl mb-4"></i><p class="text-sm">لا توجد فصول</p></div>';
                DOM.contentArea.innerHTML = `
                    <div class="flex justify-end mb-2">
                        <span class="subscriber-pill"><i class="fas fa-user-check"></i> ${count} مشترك</span>
                    </div>
                    <div class="space-y-3">
                        ${chapters.map((chap, idx) => `
                            <div onclick="pushNav({type: 'chapter', id: '${chap.id}', name: '${chap.name}'})" class="bg-white p-4 rounded-3xl shadow-sm border-r-4 border-indigo-500 flex items-center justify-between active:scale-95 transition cursor-pointer">
                                <div class="flex items-center gap-3">
                                    <div class="text-2xl font-black text-gray-100">${String(idx+1).padStart(2, '0')}</div>
                                    <h3 class="font-bold text-gray-800 text-sm">${chap.name}</h3>
                                </div>
                                <div class="w-9 h-9 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center">
                                    <i class="fas fa-chevron-left text-xs"></i>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (level === 4) {
                const currentChapter = navStack[3];
                const teacherId = navStack[2].id;
                const count = teacherSubscriberCounts[teacherId] || 0;
                updateHeader('المحاضرات', currentChapter.name, true);
                const lectures = dbData.lectures.filter(l => l.chapter === currentChapter.id);
                if(lectures.length === 0) return DOM.contentArea.innerHTML = '<div class="text-center mt-20 text-gray-400"><i class="fas fa-video-slash text-4xl mb-4"></i><p class="text-sm">لا توجد محاضرات</p></div>';
                DOM.contentArea.innerHTML = `
                    <div class="flex justify-end mb-2">
                        <span class="subscriber-pill"><i class="fas fa-user-check"></i> ${count} مشترك</span>
                    </div>
                    <div class="space-y-2.5">
                        ${lectures.map((lec, idx) => `
                            <div onclick="openLectureDetails('${lec.id}')" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between active:scale-95 transition cursor-pointer group">
                                <div class="flex items-center gap-3 min-w-0">
                                    <div class="w-11 h-11 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-500 group-hover:bg-indigo-500 group-hover:text-white transition flex-shrink-0">
                                        <i class="fas fa-play text-sm"></i>
                                    </div>
                                    <div class="min-w-0">
                                        <h3 class="font-bold text-gray-800 text-sm truncate">${lec.name}</h3>
                                        <p class="text-[11px] text-gray-400 mt-0.5">محاضرة ${idx + 1}</p>
                                    </div>
                                </div>
                                <i class="fas fa-chevron-left text-gray-300 text-sm"></i>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        window.selectGrade = async (grade) => {
            try {
                await updateDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'profile', 'data'), { grade });
                userData.grade = grade;
                navStack.push({ type: 'grade', name: grade });
                renderLecturesFlow();
            } catch(e) { showToast('حدث خطأ', 'error'); }
        };

        window.pushNav = (item) => {
            navStack.push(item);
            renderLecturesFlow();
        };

        window.openLectureDetails = async (lectureId) => {
            const lecture = dbData.lectures.find(l => l.id === lectureId);
            const teacherId = lecture.teacher;
            const teacherObj = dbData.teachers.find(t => t.id === teacherId);
            const isTeacherOwner = teacherObj && teacherObj.ownerEmail && currentUser.email && teacherObj.ownerEmail.toLowerCase() === currentUser.email.toLowerCase();
            const isSubscribed = dbData.mySubscriptions.includes(teacherId) || currentUser.email === ADMIN_EMAIL || isTeacherOwner;
            const streamUrl = `https://questions-irfj.onrender.com/video?link=${encodeURIComponent(lecture.link)}`;

            let exams = [];
            try {
                const snap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'lectures', lectureId, 'exams'));
                exams = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch(e) { console.warn('No exams', e); }

            let submissions = {};
            try {
                const subSnap = await getDocs(collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'examResults'));
                subSnap.docs.forEach(d => {
                    const data = d.data();
                    if(data.lectureId === lectureId) submissions[data.examId] = data;
                });
            } catch(e) { console.warn(e); }

            const master = document.getElementById('lectureDetailsMaster');
            master.innerHTML = `
                <div class="flex-1 overflow-y-auto bg-gray-50">
                    ${isSubscribed ? `
                        <div class="custom-player" id="customPlayer">
                            <video id="vidPlayer_${lecture.id}" playsinline webkit-playsinline preload="metadata" disablePictureInPicture controlsList="nodownload nofullscreen noremoteplayback noplaybackrate">
                                <source src="${streamUrl}" type="video/mp4">
                            </video>
                            <div class="player-red-indicator" id="redIndicator_${lecture.id}" style="display:none;"></div>
                            <div class="player-controls-overlay" id="controlsOverlay_${lecture.id}">
                                <div class="player-top-bar">
                                    <div class="text-[11px] font-semibold bg-black/40 px-2.5 py-1 rounded-full max-w-[60%] truncate">${lecture.name}</div>
                                    <button class="player-btn" id="closePlayerBtn_${lecture.id}" type="button"><i class="fas fa-times"></i></button>
                                </div>
                                <button class="player-btn big-play" id="bigPlayBtn_${lecture.id}" type="button"><i class="fas fa-play"></i></button>
                                <div class="player-bottom-bar">
                                    <div class="player-progress-wrap" id="progressWrap_${lecture.id}">
                                        <div class="player-progress-track" id="progressTrack_${lecture.id}">
                                            <div class="player-progress-buffer" id="progressBuffer_${lecture.id}" style="width:0%"></div>
                                            <div class="player-progress-fill" id="progressFill_${lecture.id}" style="width:0%"></div>
                                            <div class="player-progress-dot" id="progressDot_${lecture.id}" style="left:0%"></div>
                                        </div>
                                    </div>
                                    <div class="flex items-center justify-between mt-1">
                                        <div class="flex items-center gap-2">
                                            <button class="player-btn" id="playPauseBtn_${lecture.id}" type="button"><i class="fas fa-play"></i></button>
                                            <button class="player-btn" id="skipBackBtn_${lecture.id}" type="button"><i class="fas fa-rotate-left"></i></button>
                                            <button class="player-btn" id="skipFwdBtn_${lecture.id}" type="button"><i class="fas fa-rotate-right"></i></button>
                                            <span class="text-[11px] font-mono bg-black/40 px-2 py-1 rounded" id="timeDisplay_${lecture.id}">0:00 / 0:00</span>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <button class="player-btn" id="muteBtn_${lecture.id}" type="button"><i class="fas fa-volume-high"></i></button>
                                            <button class="player-btn" id="fsBtn_${lecture.id}" type="button"><i class="fas fa-expand"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ` : `
                        <div class="relative w-full bg-gray-900 flex flex-col items-center justify-center p-6 text-center" style="aspect-ratio:16/9;">
                            <div class="w-14 h-14 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center text-2xl mb-3">
                                <i class="fas fa-lock"></i>
                            </div>
                            <h3 class="font-bold mb-3 text-white text-sm">المحاضرة مقفلة</h3>
                            <button onclick="showCodeGate('${teacherId}', '${lecture.id}')" class="bg-indigo-600 text-white px-5 py-2 rounded-full font-bold active:scale-95 transition text-sm">
                                <i class="fas fa-key ml-1"></i> أدخل الكود للمشاهدة
                            </button>
                            <button onclick="closeLectureDetails()" class="absolute top-3 right-3 w-9 h-9 bg-white/20 rounded-full flex items-center justify-center text-white backdrop-blur-md">
                                <i class="fas fa-times text-sm"></i>
                            </button>
                        </div>
                    `}

                    <div class="p-5 bg-white rounded-t-3xl -mt-4 relative z-10 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)]">
                        <h2 class="text-lg font-black text-gray-800 mb-2">${lecture.name}</h2>
                        <div class="flex gap-2 mb-5">
                            <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-lg text-[11px] font-bold border border-indigo-100">محاضرة مسجلة</span>
                        </div>
                        <h3 class="font-bold text-gray-700 text-sm border-b pb-2 mb-3">تفاصيل المحاضرة</h3>
                        <p class="text-gray-600 leading-relaxed text-xs whitespace-pre-line mb-5">${lecture.details || 'لا توجد تفاصيل إضافية لهذه المحاضرة.'}</p>

                        ${exams.length > 0 ? `
                            <h3 class="font-bold text-gray-700 text-sm border-b pb-2 mb-3 flex items-center gap-2">
                                <i class="fas fa-file-alt text-indigo-500"></i> الامتحانات الذكية
                            </h3>
                            <div class="grid grid-cols-2 gap-3 mb-4">
                                ${exams.map((exam, i) => {

        window.closeLectureDetails = () => {

        // ================= CUSTOM VIDEO PLAYER =================
        function initCustomPlayer(lectureId) {
            const player = document.getElementById('customPlayer');
            const vid = document.getElementById(`vidPlayer_${lectureId}`);
            if(!player || !vid) return;

            const bigPlayBtn = document.getElementById(`bigPlayBtn_${lectureId}`);
            const playPauseBtn = document.getElementById(`playPauseBtn_${lectureId}`);
            const skipBackBtn = document.getElementById(`skipBackBtn_${lectureId}`);
            const skipFwdBtn = document.getElementById(`skipFwdBtn_${lectureId}`);
            const muteBtn = document.getElementById(`muteBtn_${lectureId}`);
            const fsBtn = document.getElementById(`fsBtn_${lectureId}`);
            const closePlayerBtn = document.getElementById(`closePlayerBtn_${lectureId}`);
            const progressWrap = document.getElementById(`progressWrap_${lectureId}`);
            const progressFill = document.getElementById(`progressFill_${lectureId}`);
            const progressBuffer = document.getElementById(`progressBuffer_${lectureId}`);
            const progressDot = document.getElementById(`progressDot_${lectureId}`);
            const timeDisplay = document.getElementById(`timeDisplay_${lectureId}`);
            const redIndicator = document.getElementById(`redIndicator_${lectureId}`);

            // Disable context menu / drag
            vid.addEventListener('contextmenu', e => e.preventDefault());
            vid.addEventListener('dragstart', e => e.preventDefault());
            vid.setAttribute('controlsList', 'nodownload nofullscreen noremoteplayback noplaybackrate');
            vid.disablePictureInPicture = true;
            player.addEventListener('contextmenu', e => e.preventDefault());

            closePlayerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeLectureDetails();
            });

            let hideTimeout;
            function showControls() {
                player.classList.add('controls-visible');
                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    if(!vid.paused && !vid.ended && !progressWrap.dataset.dragging) {
                        player.classList.remove('controls-visible');
                    }
                }, 3200);
            }
            function toggleControls() {
                if(player.classList.contains('controls-visible')) {
                    player.classList.remove('controls-visible');
                } else {
                    showControls();
                }
            }

            // ==== FIX 1: tap anywhere shows controls (YouTube-style) ====
            // Use pointerup so it works reliably on mobile & desktop
            let pointerStartX = 0, pointerStartY = 0, pointerMoved = false, pointerDownTime = 0;
            player.addEventListener('pointerdown', (e) => {
                pointerStartX = e.clientX;
                pointerStartY = e.clientY;
                pointerMoved = false;
                pointerDownTime = Date.now();
            }, { passive: true });
            player.addEventListener('pointermove', (e) => {
                if (Math.abs(e.clientX - pointerStartX) > 8 || Math.abs(e.clientY - pointerStartY) > 8) {
                    pointerMoved = true;
                }
            }, { passive: true });
            player.addEventListener('pointerup', (e) => {
                const dt = Date.now() - pointerDownTime;
                // ignore if dragged or too long
                if (pointerMoved || dt > 800) return;
                // ignore if tapped on buttons or progress bar
                if (e.target.closest('.player-btn') || e.target.closest('.player-progress-wrap')) return;
                // ignore if tap on close button (already handled)
                if (e.target.closest('#closePlayerBtn_' + lectureId)) return;
                toggleControls();
            });

            // Also support click for desktop (avoid double-trigger with pointerup)
            let lastPointerToggle = 0;
            player.addEventListener('click', (e) => {
                if (e.pointerType === 'mouse') return; // handled by pointerup for mouse too? handled above
                // some browsers only send click, so as fallback:
                if (Date.now() - lastPointerToggle < 500) return;
                if (e.target.closest('.player-btn') || e.target.closest('.player-progress-wrap')) return;
                // only fallback for touch devices that missed pointerup
            });

            player.addEventListener('mousemove', showControls);
            player.addEventListener('touchstart', showControls, { passive: true });

            function togglePlay() {
                if(vid.paused) {
                    vid.play().catch(()=>{});
                } else {
                    vid.pause();
                }
            }
            vid.addEventListener('play', () => {
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                bigPlayBtn.style.display = 'none';
                redIndicator.style.display = 'block';
                showControls();
            });
            vid.addEventListener('pause', () => {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                bigPlayBtn.style.display = 'flex';
                redIndicator.style.display = 'none';
                player.classList.add('controls-visible');
            });
            vid.addEventListener('ended', () => {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                bigPlayBtn.style.display = 'flex';
                redIndicator.style.display = 'none';
                player.classList.add('controls-visible');
            });

            playPauseBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
            bigPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
            skipBackBtn.addEventListener('click', (e) => { e.stopPropagation(); vid.currentTime = Math.max(0, vid.currentTime - 10); });
            skipFwdBtn.addEventListener('click', (e) => { e.stopPropagation(); vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10); });
            muteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                vid.muted = !vid.muted;
                muteBtn.innerHTML = vid.muted ? '<i class="fas fa-volume-xmark"></i>' : '<i class="fas fa-volume-high"></i>';
            });

            // ===== FIX 2: proper fullscreen =====
            let fullscreenCleanup = null;

            async function enterFullscreen() {
                // 1) try native fullscreen on the player element first
                const el = player;
                try {
                    if (el.requestFullscreen) {
                        await el.requestFullscreen();
                        fsBtn.innerHTML = '<i class="fas fa-compress"></i>';
                        return;
                    } else if (el.webkitRequestFullscreen) {
                        el.webkitRequestFullscreen();
                        fsBtn.innerHTML = '<i class="fas fa-compress"></i>';
                        return;
                    }
                } catch(err) {
                    console.warn('native fullscreen failed, falling back to CSS', err);
                }
                // 2) fallback: CSS fullscreen class
                player.classList.add('is-fullscreen');
                document.body.classList.add('fullscreen-active');
                fsBtn.innerHTML = '<i class="fas fa-compress"></i>';
                const detailDiv = document.querySelector('#lectureDetailsMaster .p-5.bg-white');
                if (detailDiv) detailDiv.style.display = 'none';
                try {
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(()=>{});
                    }
                } catch(err){}
            }
            async function exitFullscreen() {
                try {
                    if (document.fullscreenElement) await document.exitFullscreen();
                    else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
                } catch(e){}
                player.classList.remove('is-fullscreen');
                document.body.classList.remove('fullscreen-active');
                fsBtn.innerHTML = '<i class="fas fa-expand"></i>';
                const detailDiv = document.querySelector('#lectureDetailsMaster .p-5.bg-white');
                if (detailDiv) detailDiv.style.display = '';
                try {
                    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                } catch(err){}
            }

            fsBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const nativeFs = document.fullscreenElement || document.webkitFullscreenElement;
                if (nativeFs) {
                    await exitFullscreen();
                } else if (player.classList.contains('is-fullscreen')) {
                    await exitFullscreen();
                } else {
                    await enterFullscreen();
                }
            });

            // sync state when user exits native fullscreen via ESC / system button
            function handleFsChange() {
                const nativeFs = document.fullscreenElement || document.webkitFullscreenElement;
                if (nativeFs) {
                    // entered native fullscreen
                    fsBtn.innerHTML = '<i class="fas fa-compress"></i>';
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(()=>{});
                    }
                } else {
                    // exited native fullscreen
                    fsBtn.innerHTML = '<i class="fas fa-expand"></i>';
                    player.classList.remove('is-fullscreen');
                    document.body.classList.remove('fullscreen-active');
                    const detailDiv = document.querySelector('#lectureDetailsMaster .p-5.bg-white');
                    if (detailDiv) detailDiv.style.display = '';
                    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                }
            }
            document.addEventListener('fullscreenchange', handleFsChange);
            document.addEventListener('webkitfullscreenchange', handleFsChange);
            fullscreenCleanup = () => {
                document.removeEventListener('fullscreenchange', handleFsChange);
                document.removeEventListener('webkitfullscreenchange', handleFsChange);
            };

            function formatTime(s) {
                if(!isFinite(s)) return '0:00';
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return `${m}:${String(sec).padStart(2,'0')}`;
            }
            function updateProgress() {
                if(!vid.duration) return;
                const pct = (vid.currentTime / vid.duration) * 100;
                progressFill.style.width = pct + '%';
                progressDot.style.left = pct + '%';
                timeDisplay.textContent = `${formatTime(vid.currentTime)} / ${formatTime(vid.duration)}`;
                try {
                    if(vid.buffered.length > 0) {
                        const bufEnd = vid.buffered.end(vid.buffered.length - 1);
                        progressBuffer.style.width = ((bufEnd / vid.duration) * 100) + '%';
                    }
                } catch(e){}
            }
            vid.addEventListener('timeupdate', updateProgress);
            vid.addEventListener('progress', updateProgress);
            vid.addEventListener('loadedmetadata', () => {
                updateProgress();
                const saved = localStorage.getItem(`vid_${lectureId}`);
                if(saved && parseFloat(saved) < vid.duration - 5) {
                    vid.currentTime = parseFloat(saved);
                }
            });
            vid.addEventListener('timeupdate', () => {
                try { localStorage.setItem(`vid_${lectureId}`, vid.currentTime); } catch(e){}
            });

            // Progress bar dragging
            let isDragging = false;
            function seekFromClientX(clientX) {
                const rect = progressWrap.getBoundingClientRect();
                let pct = (clientX - rect.left) / rect.width;
                pct = Math.max(0, Math.min(1, pct));
                if(vid.duration) {
                    vid.currentTime = pct * vid.duration;
                    progressFill.style.width = (pct * 100) + '%';
                    progressDot.style.left = (pct * 100) + '%';
                    timeDisplay.textContent = `${formatTime(pct * vid.duration)} / ${formatTime(vid.duration)}`;
                }
            }
            progressWrap.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                isDragging = true;
                progressWrap.dataset.dragging = '1';
                try { progressWrap.setPointerCapture(e.pointerId); } catch(err){}
                seekFromClientX(e.clientX);
                showControls();
            });
            progressWrap.addEventListener('pointermove', (e) => {
                if(!isDragging) return;
                e.preventDefault();
                seekFromClientX(e.clientX);
            });
            progressWrap.addEventListener('pointerup', (e) => {
                if(!isDragging) return;
                isDragging = false;
                progressWrap.dataset.dragging = '';
                try { progressWrap.releasePointerCapture(e.pointerId); } catch(err){}
            });
            progressWrap.addEventListener('pointercancel', () => {
                isDragging = false;
                progressWrap.dataset.dragging = '';
            });

            showControls();
        }

        async function callGeminiWithFallback(contents, systemInstruction) {
            let lastError = null;
            for(const model of GEMINI_MODELS) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}`;
                    const body = { contents };
                    if(systemInstruction) body.systemInstruction = { parts: [{ text: systemInstruction }] };
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await res.json();
                    if(!res.ok) {
                        lastError = data.error?.message || `HTTP ${res.status}`;
                        continue;
                    }
                    if(data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                        return { success: true, text: data.candidates[0].content.parts[0].text, model };
                    }
                    lastError = 'لا يوجد رد من النموذج';
                } catch(e) {
                    lastError = e.message;
                }
            }
            return { success: false, error: lastError || 'فشل الاتصال بجميع النماذج' };
        }

        window.submitExam = async (lectureId, examId) => {
            if(window._examAnswers.length === 0) return showToast('أضف صورة إجابة واحدة على الأقل', 'error');
            const btn = document.getElementById('submitExamBtn');
            btn.innerHTML = '<div class="loader mx-auto border-white border-t-transparent"></div>';
            btn.disabled = true;

            try {
                const examSnap = await getDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'lectures', lectureId, 'exams', examId));
                const examData = examSnap.data();

                const parts = [
                    { text: "أنت مصحح امتحانات خبير. سيتم إعطاؤك صورة أسئلة الامتحان ثم صور إجابات الطالب. قيّم الإجابات وأعطِ درجة من 100. اشرح الأخطاء بوضوح. إذا كان الطالب لم يجب على سؤال، احسبه خطأ. إذا كان السؤال اختياري/يمكن تخطيه، فلا تحسبه ضمن المجموع. في النهاية اكتب: الدرجة النهائية: X/100" },
                    { text: "صورة أسئلة الامتحان:" },
                    { inlineData: { mimeType: "image/jpeg", data: examData.image.split(',')[1] } }
                ];
                for(let i = 0; i < window._examAnswers.length; i++) {
                    parts.push({ text: `صورة إجابة الطالب رقم ${i+1}:` });
                    const b64 = window._examAnswers[i];
                    parts.push({ inlineData: { mimeType: "image/jpeg", data: b64.split(',')[1] } });
                }

                const result = await callGeminiWithFallback([{ parts }], "أنت مصحح امتحانات عراقي. اكتب التقرير بالعربية بوضوح.");
                if(!result.success) {
                    btn.innerHTML = '<i class="fas fa-paper-plane ml-1"></i> إرسال الإجابات للتصحيح';
                    btn.disabled = false;
                    return showToast('فشل التصحيح: ' + result.error, 'error');
                }

                const feedback = result.text;
                let score = 0;
                const match = feedback.match(/(\d{1,3})\s*\/\s*100/);
                if(match) score = Math.min(100, parseInt(match[1]));
                else {
                    const m2 = feedback.match(/الدرجة\s*[:：]?\s*(\d{1,3})/);
                    if(m2) score = Math.min(100, parseInt(m2[1]));
                }

                const rId = `${lectureId}_${examId}`;
                await setDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'examResults', rId), {
                    lectureId, examId, score, feedback,
                    submittedAt: Date.now(),
                    studentName: userData.name || 'طالب'
                });

                showModal(`
                    <div class="text-center">
                        <div class="w-16 h-16 ${score >= 50 ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'} rounded-full flex items-center justify-center text-2xl mx-auto mb-3">
                            <i class="fas fa-${score >= 50 ? 'trophy' : 'frown'}"></i>
                        </div>
                        <h3 class="text-base font-bold mb-2">نتيجة التصحيح</h3>
                        <div class="text-4xl font-black ${score >= 50 ? 'text-green-600' : 'text-red-600'} mb-3">${score}<span class="text-xl text-gray-400">/100</span></div>
                        <div class="text-right bg-gray-50 p-3 rounded-xl text-xs text-gray-700 max-h-64 overflow-y-auto whitespace-pre-line mb-3">${feedback.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>
                        <button onclick="closeModal(); backFromExam('${lectureId}')" class="w-full bg-indigo-600 text-white font-bold rounded-xl py-3 text-sm">حسناً</button>
                    </div>
                `);

            } catch(e) {
