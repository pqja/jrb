<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- منع التكبير والتصغير ليعمل كتطبيق حقيقي -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة درب التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --secondary: #10B981;
            --bg-color: #F8FAFC; /* لون خلفية أريح للعين */
            --text-main: #1F2937;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            /* منع النسخ واللصق والتحديد */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior-y: none;
        }

        input, textarea, select {
            font-size: 16px !important;
            -webkit-user-select: auto;
            user-select: auto;
        }

        /* تحسين شاشة تسجيل الدخول */
        .auth-bg {
            background: linear-gradient(135deg, #1e1b4b, #312e81, #4338ca);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.7); /* لون داكن شبه شفاف */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-dark {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
        }
        .input-dark::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .input-dark:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.6);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bottom-nav {
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
        }

        .nav-item.active { color: var(--primary); }
        .nav-item.active .nav-icon {
            transform: translateY(-4px);
            transition: all 0.3s ease;
        }

        video {
            width: 100%;
            background: #000;
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(10px);
        }

        .chat-msg-user { background: var(--primary); color: white; border-radius: 16px 16px 0 16px; }
        .chat-msg-bot { background: white; color: var(--text-main); border-radius: 16px 16px 16px 0; border: 1px solid #e5e7eb; }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 24px; height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Splash Screen Animation */
        .splash-logo {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .7; transform: scale(1.05); }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col relative">

    <!-- التنبيهات -->
    <div id="toast" class="toast px-6 py-3 rounded-full text-white font-semibold shadow-lg"></div>

    <!-- نافذة منبثقة (Modal) -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div id="modalContent" class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto">
        </div>
    </div>

    <!-- 0. شاشة البداية (Splash Screen) -->
    <div id="splashScreen" class="absolute inset-0 z-50 bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-28 h-28 bg-indigo-600 rounded-3xl flex items-center justify-center shadow-2xl splash-logo mb-6">
            <i class="fas fa-graduation-cap text-6xl text-white"></i>
        </div>
        <h1 class="text-3xl font-black text-gray-800 tracking-tight">منصة درب</h1>
        <p class="text-gray-500 mt-2 font-semibold">طريقك نحو التفوق</p>
        <div class="loader mt-8 border-indigo-200 border-t-indigo-600"></div>
    </div>

    <!-- 1. شاشة تسجيل الدخول / إنشاء حساب (تم تحسين التصميم) -->
    <div id="authScreen" class="absolute inset-0 z-40 auth-bg flex items-center justify-center p-4 overflow-y-auto hidden">
        <div class="glass-card w-full max-w-sm rounded-[2rem] p-8 relative">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-lg mb-4">
                    <i class="fas fa-graduation-cap text-4xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">مرحباً بك</h1>
                <p class="text-gray-300 text-sm">سجل دخولك للمتابعة</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" class="w-full input-dark rounded-xl px-4 py-3 focus:outline-none transition" required>
                </div>
                <div>
                    <input type="password" id="loginPassword" placeholder="الرمز السري" class="w-full input-dark rounded-xl px-4 py-3 focus:outline-none transition" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold rounded-xl py-3 shadow-lg hover:bg-indigo-500 transition transform active:scale-95 mt-2">تسجيل الدخول</button>
                <p class="text-center text-gray-300 text-sm mt-6 cursor-pointer hover:text-white transition" onclick="toggleAuth('signup')">لا تملك حساب؟ <span class="font-bold text-indigo-400">أنشئ حساب الآن</span></p>
            </form>

            <form id="signupForm" class="space-y-4 hidden">
                <div>
                    <input type="text" id="signupName" placeholder="الاسم الثلاثي" class="w-full input-dark rounded-xl px-4 py-3 focus:outline-none transition" required>
                </div>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-gray-400" dir="ltr">+964</span>
                    <input type="tel" id="signupPhone" placeholder="07XXXXXXXXX" pattern="07[0-9]{9}" title="يجب أن يبدأ ب 07 ويتكون من 11 رقم" class="w-full input-dark rounded-xl pl-16 pr-4 py-3 focus:outline-none transition text-right" required>
                </div>
                <div>
                    <input type="email" id="signupEmail" placeholder="البريد الإلكتروني" class="w-full input-dark rounded-xl px-4 py-3 focus:outline-none transition" required>
                </div>
                <div>
                    <input type="password" id="signupPassword" placeholder="رمز الحساب" class="w-full input-dark rounded-xl px-4 py-3 focus:outline-none transition" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold rounded-xl py-3 shadow-lg hover:bg-indigo-500 transition transform active:scale-95 mt-2">إنشاء الحساب</button>
                <p class="text-center text-gray-300 text-sm mt-6 cursor-pointer hover:text-white transition" onclick="toggleAuth('login')">لديك حساب؟ <span class="font-bold text-indigo-400">سجل دخولك</span></p>
            </form>
        </div>
    </div>

    <!-- 2. واجهة التطبيق الرئيسية -->
    <div id="mainApp" class="hidden flex-1 h-full flex flex-col relative pb-[70px]">
        <header class="bg-white shadow-sm px-4 py-3 flex justify-between items-center z-10 rounded-b-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 shadow-inner">
                    <i class="fas fa-book-open"></i>
                </div>
                <div>
                    <h2 class="font-bold text-gray-800 text-lg leading-tight" id="headerTitle">المحاضرات</h2>
                    <p class="text-xs text-gray-500" id="headerSub">منصة درب</p>
                </div>
            </div>
            <button id="backBtn" class="hidden w-10 h-10 bg-gray-100 rounded-full items-center justify-center text-gray-600 active:bg-gray-200 transition" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
        </header>

        <main id="contentArea" class="flex-1 overflow-y-auto p-4 scroll-smooth bg-gray-50/50">
        </main>

        <nav class="bottom-nav bg-white fixed bottom-0 w-full h-[70px] rounded-t-3xl flex justify-around items-center px-2 z-20">
            <button class="nav-item active flex flex-col items-center justify-center w-20 h-full" onclick="switchTab('lectures', this)">
                <div class="nav-icon text-xl mb-1"><i class="fas fa-play-circle"></i></div>
                <span class="text-[10px] font-bold">المحاضرات</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center w-20 h-full relative" onclick="switchTab('ai', this)">
                <div class="nav-icon text-xl mb-1"><i class="fas fa-robot"></i></div>
                <span class="text-[10px] font-bold">المساعد الذكي</span>
            </button>
            <button class="nav-item flex flex-col items-center justify-center w-20 h-full" onclick="switchTab('profile', this)">
                <div class="nav-icon text-xl mb-1"><i class="fas fa-user"></i></div>
                <span class="text-[10px] font-bold">حسابي</span>
            </button>
        </nav>
    </div>

    <!-- حاوية لوحة التحكم الحرة -->
    <div id="adminContainerMaster" class="hidden absolute inset-0 z-[100] bg-gray-100 flex flex-col h-full w-full overflow-hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_VdrKx54tADWsmRDz1QSNn_bHnrbFI88",
            authDomain: "darb-56124.firebaseapp.com",
            projectId: "darb-56124",
            storageBucket: "darb-56124.firebasestorage.app",
            messagingSenderId: "705925344755",
            appId: "1:705925344755:web:e00882d29cf122d5c8f686",
            measurementId: "G-5G66M3LYJ6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = 'darb-56124'; 
        const ADMIN_EMAIL = "mslmalmyaly223@gmail.com";
        const GEMINI_API_KEY = "UPWMTf9wd0h9rs9yAA-e09TiinUL1G5PBBySazIA";

        let currentUser = null;
        let userData = null;
        let currentTab = 'lectures';
        let navStack = []; 

        let dbData = {
            subjects: [], teachers: [], chapters: [], lectures: [], mySubscriptions: [], codes: []
        };

        const DOM = {
            splashScreen: document.getElementById('splashScreen'),
            authScreen: document.getElementById('authScreen'),
            mainApp: document.getElementById('mainApp'),
            loginForm: document.getElementById('loginForm'),
            signupForm: document.getElementById('signupForm'),
            contentArea: document.getElementById('contentArea'),
            headerTitle: document.getElementById('headerTitle'),
            headerSub: document.getElementById('headerSub'),
            backBtn: document.getElementById('backBtn'),
            toast: document.getElementById('toast'),
            modalOverlay: document.getElementById('modalOverlay'),
            modalContent: document.getElementById('modalContent')
        };

        window.showToast = (msg, type = 'success') => {
            DOM.toast.textContent = msg;
            DOM.toast.className = `toast show px-6 py-3 rounded-full text-white font-semibold shadow-lg ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            setTimeout(() => DOM.toast.classList.remove('show'), 3000);
        };

        window.toggleAuth = (type) => {
            if(type === 'signup') {
                DOM.loginForm.classList.add('hidden');
                DOM.signupForm.classList.remove('hidden');
            } else {
                DOM.signupForm.classList.add('hidden');
                DOM.loginForm.classList.remove('hidden');
            }
        };

        window.showModal = (htmlContent) => {
            DOM.modalContent.innerHTML = htmlContent;
            DOM.modalOverlay.classList.remove('hidden');
            setTimeout(() => DOM.modalContent.classList.remove('scale-95'), 10);
        };

        window.closeModal = () => {
            DOM.modalContent.classList.add('scale-95');
            setTimeout(() => {
                DOM.modalOverlay.classList.add('hidden');
                DOM.modalContent.innerHTML = '';
            }, 300);
        };

        // Helper to convert Image to Base64
        window.fileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        };

        DOM.loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = '<div class="loader mx-auto border-white border-t-transparent"></div>';
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                showToast('البريد أو الرمز السري غير صحيح', 'error');
                btn.innerHTML = originalText;
            }
        });

        DOM.signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const phone = document.getElementById('signupPhone').value;
            const email = document.getElementById('signupEmail').value;
            const pass = document.getElementById('signupPassword').value;
            
            if(!/^07[0-9]{9}$/.test(phone)) return showToast('رقم الهاتف غير صحيح', 'error');
            if(name.trim().split(/\s+/).length < 3) return showToast('يرجى كتابة الاسم الثلاثي', 'error');

            const btn = e.target.querySelector('button');
            btn.innerHTML = '<div class="loader mx-auto border-white border-t-transparent"></div>';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, 'artifacts', APP_ID, 'users', userCredential.user.uid, 'profile', 'data'), {
                    name, phone, grade: '', gender: Math.random() > 0.5 ? 'boy' : 'girl'
                });
            } catch (error) {
                showToast('خطأ: ' + error.message, 'error');
                btn.innerHTML = 'إنشاء الحساب';
            }
        });

        async function fetchInitialData() {
            if (!currentUser) return;
            DOM.contentArea.innerHTML = '<div class="flex h-full items-center justify-center"><div class="loader border-indigo-600 border-t-transparent w-10 h-10"></div></div>';
            
            try {
                const profileDoc = await getDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'profile', 'data'));
                if (profileDoc.exists()) {
                    userData = profileDoc.data();
                } else {
                    userData = { name: 'طالب', grade: '', gender: 'boy' };
                }

                const subsSnapshot = await getDocs(collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'subscriptions'));
                dbData.mySubscriptions = subsSnapshot.docs.map(d => d.id);

                const colls = ['subjects', 'teachers', 'chapters', 'lectures'];
                for(let col of colls) {
                    const snap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', col));
                    dbData[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                }
                
                // Sort lectures chronologically based on timestamp
                dbData.lectures.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                // إذا كان الطالب محدد مرحلته مسبقاً، ننتقل للمواد مباشرة
                if (userData.grade && currentTab === 'lectures' && navStack.length === 0) {
                    navStack.push({ type: 'grade', name: userData.grade });
                }

                renderCurrentTab();
            } catch(e) {
                console.error(e);
                showToast("حدث خطأ في جلب البيانات", "error");
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                DOM.authScreen.classList.add('hidden');
                DOM.mainApp.classList.remove('hidden');
                setTimeout(() => DOM.splashScreen.style.opacity = '0', 1000);
                setTimeout(() => DOM.splashScreen.classList.add('hidden'), 1500);
                fetchInitialData();
            } else {
                currentUser = null; userData = null;
                setTimeout(() => DOM.splashScreen.style.opacity = '0', 1500);
                setTimeout(() => DOM.splashScreen.classList.add('hidden'), 2000);
                DOM.mainApp.classList.add('hidden');
                DOM.authScreen.classList.remove('hidden');
            }
        });

        window.switchTab = (tabName, btnElement) => {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            currentTab = tabName;
            
            if(tabName === 'lectures' && userData && userData.grade) {
                navStack = [{ type: 'grade', name: userData.grade }];
            } else {
                navStack = [];
            }
            renderCurrentTab();
        };

        window.goBack = () => {
            if(navStack.length > 0) {
                // منع الرجوع للمرحلة إذا كانت محفوظة
                if(navStack.length === 1 && userData && userData.grade) {
                    return; // لا ترجع، أنت في الصفحة الرئيسية للمواد
                }
                navStack.pop();
                renderLecturesFlow();
            }
        };

        function updateHeader(title, sub, showBack = false) {
            DOM.headerTitle.textContent = title;
            DOM.headerSub.textContent = sub;
            // إخفاء زر الرجوع إذا كنا في أول صفحة بعد تحديد المرحلة
            if(navStack.length === 1 && userData && userData.grade) showBack = false;
            DOM.backBtn.style.display = showBack ? 'flex' : 'none';
        }

        function renderCurrentTab() {
            DOM.contentArea.innerHTML = '';
            DOM.backBtn.style.display = 'none';

            if (currentTab === 'lectures') renderLecturesFlow();
            else if (currentTab === 'ai') renderAI();
            else if (currentTab === 'profile') renderProfile();
        }

        function renderLecturesFlow() {
            const level = navStack.length;
            DOM.contentArea.innerHTML = '';
            
            if (level === 0) {
                updateHeader('المراحل الدراسية', 'اختر مرحلتك', false);
                const grades = ['السادس العلمي', 'الثالث متوسط'];
                DOM.contentArea.innerHTML = `
                    <div class="space-y-4 mt-4">
                        ${grades.map(grade => `
                            <div onclick="selectGrade('${grade}')" class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-between active:scale-95 transition cursor-pointer">
                                <div>
                                    <h3 class="font-bold text-xl text-gray-800">${grade}</h3>
                                    <p class="text-sm text-gray-500 mt-1">تحديد كمرحلتي الدراسية</p>
                                </div>
                                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-xl">
                                    <i class="fas fa-chevron-left"></i>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (level === 1) {
                const currentGrade = navStack[0].name;
                updateHeader('المواد الدراسية', currentGrade, false);
                
                const subjects = dbData.subjects.filter(s => s.grade === currentGrade);
                if(subjects.length === 0) return DOM.contentArea.innerHTML = '<div class="text-center mt-20 text-gray-400"><i class="fas fa-folder-open text-4xl mb-4"></i><p>لا توجد مواد مضافة</p></div>';

                DOM.contentArea.innerHTML = `
                    <div class="grid grid-cols-2 gap-4 mt-2">
                        ${subjects.map(sub => `
                            <div onclick="pushNav({type: 'subject', id: '${sub.id}', name: '${sub.name}'})" class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center active:scale-95 transition cursor-pointer h-36 relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-16 h-16 bg-indigo-50 rounded-bl-[2rem] -z-0"></div>
                                <i class="fas fa-book text-3xl text-indigo-500 mb-3 z-10"></i>
                                <h3 class="font-bold text-gray-800 z-10">${sub.name}</h3>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (level === 2) {
                const currentGrade = navStack[0].name;
                const currentSubject = navStack[1];
                updateHeader('المدرسين', currentSubject.name, true);

                const teachers = dbData.teachers.filter(t => t.grade === currentGrade && t.subject === currentSubject.id);
                if(teachers.length === 0) return DOM.contentArea.innerHTML = '<div class="text-center mt-20 text-gray-400"><i class="fas fa-users text-4xl mb-4"></i><p>لا يوجد مدرسين</p></div>';

                DOM.contentArea.innerHTML = `
                    <div class="space-y-3 mt-2">
                        ${teachers.map(teacher => `
                            <div onclick="pushNav({type: 'teacher', id: '${teacher.id}', name: '${teacher.name}'})" class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4 active:scale-95 transition cursor-pointer">
                                <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl flex items-center justify-center overflow-hidden shadow-md">
                                    ${teacher.image ? `<img src="${teacher.image}" class="w-full h-full object-cover">` : `<i class="fas fa-chalkboard-teacher text-white text-2xl"></i>`}
                                </div>
                                <div class="flex-1">
                                    <h3 class="font-bold text-gray-800 text-lg">${teacher.name}</h3>
                                    <p class="text-xs text-indigo-500 mt-1 font-semibold">استعراض الفصول</p>
                                </div>
                                <i class="fas fa-chevron-left text-gray-300"></i>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (level === 3) {
                const currentTeacher = navStack[2];
                updateHeader('الفصول', currentTeacher.name, true);

                const chapters = dbData.chapters.filter(c => c.teacher === currentTeacher.id);

            try {
                const codeDocRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'codes', input);
                const codeDoc = await getDoc(codeDocRef);

                if(!codeDoc.exists()) return showToast("الكود غير صحيح", "error");
                const codeData = codeDoc.data();

                if(codeData.used) return showToast("هذا الكود مستخدم مسبقاً", "error");
                if(codeData.teacher !== teacherId) return showToast("الكود لا يطابق هذا الأستاذ", "error");

                await updateDoc(codeDocRef, {
                    used: true, usedBy: currentUser.uid, usedAt: new Date().toISOString()
                });

                await setDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'subscriptions', teacherId), { active: true });

                const response = await fetch(apiUrl, {
                    method: 'POST',

                    body: JSON.stringify({
                        contents: [{ parts: [{ text: msg }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }

                const result = await response.json();

                chatBox.innerHTML += `

                `;
                chatBox.scrollTop = chatBox.scrollHeight;

                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="flex gap-3"><div class="chat-msg-bot text-red-500 p-3 text-sm">حدث خطأ في الاتصال.</div></div>`;

                    <div class="space-y-2">
                        ${dbData.subjects.map(s => `
                            <div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                                <div><span class="font-bold">${s.name}</span> <span class="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">${s.grade}</span></div>
                                <button onclick="v_delItem('subjects', '${s.id}')" class="text-red-500 w-8 h-8 bg-red-50 rounded-lg flex items-center justify-center"><i class="fas fa-trash"></i></button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } 
            else if (type === 'teachers') {
                title.innerText = 'إدارة الأساتذة';
                content.innerHTML = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 border border-gray-200">
                        <select id="v_tch_sub" class="w-full mb-2 border rounded-xl p-3 bg-gray-50">
                            ${dbData.subjects.map(s => `<option value="${s.id}">${s.grade} - ${s.name}</option>`).join('')}
                        </select>
                        <input type="text" id="v_tch_name" placeholder="اسم الأستاذ" class="w-full mb-2 border rounded-xl p-3 bg-gray-50">
                        <label class="block text-sm text-gray-500 mb-1">صورة الأستاذ (اختياري):</label>
                        <input type="file" id="v_tch_img" accept="image/*" class="w-full mb-3 border rounded-xl p-2 bg-gray-50 text-sm">
                        <button onclick="v_addTeacher()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl">إضافة الأستاذ</button>
                    </div>
                    <div class="space-y-2">
                        ${dbData.teachers.map(t => {
                            const subName = dbData.subjects.find(x => x.id === t.subject)?.name || '';
                            return `
                            <div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-lg bg-gray-200 overflow-hidden">${t.image ? `<img src="${t.image}" class="w-full h-full object-cover">` : ''}</div>
                                    <div><div class="font-bold text-sm">${t.name}</div><div class="text-xs text-gray-500">${t.grade} - ${subName}</div></div>
                                </div>
                                <button onclick="v_delItem('teachers', '${t.id}')" class="text-red-500 bg-red-50 p-2 rounded-lg"><i class="fas fa-trash"></i></button>
                            </div>`
                        }).join('')}
                    </div>
                `;
            }
            else if (type === 'chapters') {
                title.innerText = 'إدارة الفصول';
                content.innerHTML = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 border border-gray-200">
                        <select id="v_chp_tch" class="w-full mb-2 border rounded-xl p-3 bg-gray-50">
                            ${dbData.teachers.map(t => `<option value="${t.id}">${t.name} (${t.grade})</option>`).join('')}
                        </select>
                        <input type="text" id="v_chp_name" placeholder="اسم الفصل (مثال: الفصل الأول)" class="w-full mb-3 border rounded-xl p-3 bg-gray-50">
                        <button onclick="v_addChapter()" class="w-full bg-purple-600 text-white font-bold py-3 rounded-xl">إضافة الفصل</button>
                    </div>
                    <div class="space-y-2">
                        ${dbData.chapters.map(c => {
                            const tName = dbData.teachers.find(x => x.id === c.teacher)?.name || '';
                            return `
                            <div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                                <div><div class="font-bold text-sm">${c.name}</div><div class="text-xs text-gray-500">أ. ${tName}</div></div>
                                <button onclick="v_delItem('chapters', '${c.id}')" class="text-red-500 bg-red-50 p-2 rounded-lg"><i class="fas fa-trash"></i></button>
                            </div>`
                        }).join('')}
                    </div>
                `;
            }
            else if (type === 'lectures') {
                title.innerText = 'إدارة المحاضرات';
                content.innerHTML = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 border border-gray-200">
                        <select id="v_lec_chp" class="w-full mb-2 border rounded-xl p-3 bg-gray-50 text-sm">
                            ${dbData.chapters.map(c => {
                                const t = dbData.teachers.find(x => x.id === c.teacher);
                                return `<option value="${c.id}">${c.name} - ${t?.name || ''}</option>`;
                            }).join('')}
                        </select>
                        <input type="text" id="v_lec_name" placeholder="اسم المحاضرة" class="w-full mb-2 border rounded-xl p-3 bg-gray-50">
                        <input type="url" id="v_lec_link" placeholder="رابط رسالة التلكرام" class="w-full mb-2 border rounded-xl p-3 bg-gray-50 text-left" dir="ltr">
                        <textarea id="v_lec_details" placeholder="التفاصيل الاضافية للمحاضرة..." class="w-full mb-3 border rounded-xl p-3 bg-gray-50 h-24 resize-none"></textarea>
                        <button onclick="v_addLecture()" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl">نشر المحاضرة</button>
                    </div>
                    <div class="space-y-2">
                        ${dbData.lectures.map(l => `
                            <div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                                <div><div class="font-bold text-sm">${l.name}</div><div class="text-xs text-gray-400 truncate w-48">${l.link}</div></div>
                                <button onclick="v_delItem('lectures', '${l.id}')" class="text-red-500 bg-red-50 p-2 rounded-lg"><i class="fas fa-trash"></i></button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            else if (type === 'codes') {
                title.innerText = 'إدارة الأكواد';
                
                // Fetch codes freshly
                let html = '<div class="text-center py-10"><div class="loader mx-auto border-indigo-500 border-t-transparent"></div></div>';
                content.innerHTML = html;
                
                try {
                    const snap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'codes'));
                    dbData.codes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    
                    content.innerHTML = `
                        <div class="bg-gray-800 p-4 rounded-2xl shadow-lg mb-6 border border-gray-700">
                            <select id="v_cod_tch" class="w-full mb-3 border border-gray-600 rounded-xl p-3 bg-gray-700 text-white">
                                ${dbData.teachers.map(t => `<option value="${t.id}">${t.grade} - ${t.name}</option>`).join('')}
                            </select>
                            <button onclick="v_addCode()" class="w-full bg-yellow-500 text-gray-900 font-bold py-3 rounded-xl active:bg-yellow-600 shadow-md">إنشاء كود جديد (لاستخدام واحد)</button>
                        </div>
                        <h3 class="font-bold mb-3 text-gray-700">سجل الأكواد:</h3>
                        <div class="space-y-3">
                            ${dbData.codes.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).map(c => {
                                const tName = dbData.teachers.find(x => x.id === c.teacher)?.name || 'مجهول';
                                const statusClass = c.used ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-700';
                                const statusText = c.used ? 'مستخدم (غير نشط)' : 'جديد (نشط)';
                                return `
                                <div class="bg-white p-4 rounded-xl border flex flex-col shadow-sm gap-2">
                                    <div class="flex justify-between items-start">
                                        <div class="font-mono font-bold text-lg tracking-widest text-gray-800 select-all">${c.id}</div>
                                        <span class="text-[10px] font-bold px-2 py-1 rounded ${statusClass}">${statusText}</span>
                                    </div>
                                    <div class="text-xs text-gray-500 border-b pb-2">أ. ${tName}</div>
                                    <button onclick="v_delCode('${c.id}', '${c.usedBy || ''}', '${c.teacher}')" class="w-full mt-1 bg-red-50 text-red-600 text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-2">
                                        <i class="fas fa-trash"></i> حذف الكود ${c.used ? '(وإلغاء الصلاحية)' : ''}
                                    </button>
                                </div>`
                            }).join('')}
                        </div>
                    `;
                } catch(e) {
                    content.innerHTML = '<div class="text-red-500 text-center">خطأ في جلب الأكواد</div>';
                }
            }
        };

        window.v_addSubject = async () => {
            const grade = document.getElementById('v_sub_grade').value;
            const name = document.getElementById('v_sub_name').value.trim();
            if(!name) return showToast('اكتب الاسم', 'error');
            try {
                const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'subjects'));
                await setDoc(docRef, { grade, name });
                dbData.subjects.push({ id: docRef.id, grade, name });
                showToast('تم'); openAdminView('subjects');
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_addTeacher = async () => {
            const subId = document.getElementById('v_tch_sub').value;
            const name = document.getElementById('v_tch_name').value.trim();
            const imgFile = document.getElementById('v_tch_img').files[0];
            if(!name) return showToast('اكتب الاسم', 'error');
            
            let base64Img = null;
            if(imgFile) base64Img = await fileToBase64(imgFile);

            const subject = dbData.subjects.find(s => s.id === subId);
            try {
                const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'teachers'));
                const data = { grade: subject.grade, subject: subId, name, image: base64Img };
                await setDoc(docRef, data);
                dbData.teachers.push({ id: docRef.id, ...data });
                showToast('تم'); openAdminView('teachers');
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_addChapter = async () => {
            const teacherId = document.getElementById('v_chp_tch').value;
            const name = document.getElementById('v_chp_name').value.trim();
            if(!name) return;
            const teacher = dbData.teachers.find(t => t.id === teacherId);
            try {
                const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'chapters'));
                const data = { grade: teacher.grade, subject: teacher.subject, teacher: teacherId, name };
                await setDoc(docRef, data);
                dbData.chapters.push({ id: docRef.id, ...data });
                showToast('تم'); openAdminView('chapters');
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_addLecture = async () => {
            const chapterId = document.getElementById('v_lec_chp').value;
            const name = document.getElementById('v_lec_name').value.trim();
            const link = document.getElementById('v_lec_link').value.trim();
            const details = document.getElementById('v_lec_details').value.trim();
            if(!name || !link) return showToast('الاسم والرابط مطلوبان', 'error');
            const chapter = dbData.chapters.find(c => c.id === chapterId);
            try {
                const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'lectures'));
                const data = { grade: chapter.grade, subject: chapter.subject, teacher: chapter.teacher, chapter: chapterId, name, link, details, timestamp: Date.now() };
                await setDoc(docRef, data);
                dbData.lectures.push({ id: docRef.id, ...data });
                showToast('تم'); openAdminView('lectures');
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_addCode = async () => {
            const teacherId = document.getElementById('v_cod_tch').value;
            const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
            const codeId = `DARB-${randomStr}`;
            try {
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'codes', codeId), {
                    teacher: teacherId, used: false, usedBy: null, createdAt: new Date().toISOString()
                });
                showToast('تم إنشاء الكود'); openAdminView('codes');
            } catch(e) { showToast('خطأ', 'error'); }
        };

        window.v_delItem = async (col, id) => {
            if(!confirm('هل أنت متأكد من الحذف؟')) return;
            try {
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', col, id));
                dbData[col] = dbData[col].filter(x => x.id !== id);
                showToast('تم الحذف'); openAdminView(col);
            } catch(e) { showToast('خطأ بالحذف', 'error'); }
        };

        window.v_delCode = async (codeId, usedByUserId, teacherId) => {
            if(!confirm('هل أنت متأكد؟ إذا كان مستخدماً سيتم سحب الصلاحية من الطالب.')) return;
            try {
                if(usedByUserId && teacherId) {
                    // سحب الصلاحية
                    await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', usedByUserId, 'subscriptions', teacherId));
                }
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'codes', codeId));
                showToast('تم حذف الكود وإلغاء الصلاحية (إن وجدت)'); openAdminView('codes');
            } catch(e) { showToast('خطأ بالحذف', 'error'); }
        };
    </script>
</body>
</html>
